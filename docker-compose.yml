services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mealmuse-postgres

    environment:
      POSTGRES_DB: mealmuse
      POSTGRES_USER: mealmuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - mealmuse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealmuse -d mealmuse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mealmuse_postgres_data:
    driver: local