services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mealmuse-postgres

    environment:
      POSTGRES_DB: mealmuse
      POSTGRES_USER: mealmuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - mealmuse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealmuse -d mealmuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: mealmuse-backend

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealmuse
      POSTGRES_USER: mealmuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_ENV: production
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
    
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: mealmuse-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  mealmuse_postgres_data:
    driver: local